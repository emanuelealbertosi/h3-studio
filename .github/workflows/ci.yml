name: H3 Studio CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run sanitize:workflows
      - run: git diff --exit-code -- workflows
      - run: npm run typecheck
      - run: npm run test:setup
      - run: npm run test:projects
      - run: npm run test:postprocess
      - run: npm run test:repair-processing-times
      - run: npm run test:images
      - run: npm run test:chat
      - run: npm run test:audio
      - run: npm run test:fast
      - run: npm run test:cancel
      - run: npm run test:restart
      - run: npm run test:preview-layout
      - run: npm run build
